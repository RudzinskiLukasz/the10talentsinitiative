<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ten Talents" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="The Ten Talents Initiative empowers Catholic youth to nurture their God-given gifts through faith, mentorship, media, and community. My gifts are for Christ and His Church."
    />
    <meta name="theme-color" content="#0d0820" />

    <script>
      // Set theme + variant before paint to avoid a flash of the wrong look.
      (function () {
        var themeColors = {
          dark: { default: "#0d0820", "paper-glass": "#1c1c1e", ona: "#1a0f1a" },
          light: { default: "#f7f3ec", "paper-glass": "#f5f5f7", ona: "#faf6f0" },
        };
        var knownVariants = { "paper-glass": true, ona: true };

        try {
          var stored = localStorage.getItem("ttt-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);

          var variant = localStorage.getItem("ttt-theme-variant");
          if (knownVariants[variant]) {
            document.documentElement.setAttribute("data-theme-variant", variant);
          }

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            var variantKey = knownVariants[variant] ? variant : "default";
            meta.setAttribute("content", themeColors[theme][variantKey]);
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <meta property="og:title" content="The Ten Talents Initiative" />
    <meta
      property="og:description"
      content="Empowering Catholic youth to let their gifts shine for Christ and His Church."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>The Ten Talents Initiative — My Gifts Are For Christ and His Church</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
