# Static site blueprint — no start command; Render publishes ./build to the CDN.
# See README "Deploy on Render" for dashboard setup and Web Service fallback.
services:
  - type: web
    name: the10talentsinitiative
    runtime: static
    # Render sets NODE_ENV=production during builds, which makes a plain
    # `npm install` skip devDependencies (where vite & friends live), causing
    # "vite: not found". `--include=dev` forces them to be installed.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./build
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # SPA fallback: serve index.html for any path so client-side routing works.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Site-wide security headers (also mirrored in index.html meta where applicable)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # CSP: Vite bundles scripts to /assets; index.html inline theme bootstrap needs
      # 'unsafe-inline' for script-src. Tailwind/runtime styles need 'unsafe-inline' for style-src.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.paystack.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://checkout.paystack.com https://*.supabase.co; media-src 'self' https://*.supabase.co; connect-src 'self' https://api.paystack.co https://api.web3forms.com https://*.supabase.co wss://*.supabase.co; frame-src https://checkout.paystack.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.paystack.com"
